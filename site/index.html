<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手写数字生成器 · Mini DDPM</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#202f32;font:16px system-ui,sans-serif}main{max-width:860px;margin:8vh auto;padding:24px}h1{font-size:clamp(30px,6vw,52px);margin:0 0 30px}section{display:grid;grid-template-columns:1fr 1fr;gap:26px}canvas{display:block;width:100%;background:#101915;image-rendering:pixelated;border-radius:6px}form{display:grid;gap:12px;align-content:start}label{display:grid;gap:4px;font-size:14px}select,input,button{width:100%;padding:10px;border-radius:5px;border:1px solid #a9b3ac;background:white;font:inherit}button{background:#145e51;color:white;cursor:pointer}button:disabled{opacity:.55}progress{width:100%}output{font-variant-numeric:tabular-nums}footer{margin-top:22px;font-size:14px} @media(max-width:560px){main{margin:0 auto}section{grid-template-columns:1fr}canvas{max-width:260px}}</style>
<main><h1>手写数字生成器</h1><section><div><canvas width="28" height="28" aria-label="生成的手写数字"></canvas><p id="status" role="status">检查 WebGPU…</p><progress value="0" max="1"></progress></div><form><label>生成模式<select id="mode"><option value="conditional">指定数字</option><option value="unconditional">随机类别</option></select></label><label>目标数字<select id="digit"></select></label><label>DDIM 步数<select id="steps"><option>10</option><option>20</option><option selected>50</option><option>200</option></select></label><label>随机种子<input id="seed" type="number" min="0" max="4294967295" step="1" value="2026" required></label><button disabled>生成数字</button><output id="timing"></output></form></section><footer>模型在浏览器中运行。改变种子可生成另一种写法。 · <a href="./cifar-vae/">CIFAR-10 图像重建实验</a></footer></main><script type="module" src="./app.js"></script></html>
